# Zaroor Shop beside another site already using port 80.
# This file listens on 8080 only. Do not edit the other site's Nginx files.
#
#   sudo cp deploy/nginx/zaroor-vps-8080.conf /etc/nginx/sites-available/zaroor-vps
#   sudo ln -s /etc/nginx/sites-available/zaroor-vps /etc/nginx/sites-enabled/zaroor-vps
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8080;
    server_name 187.77.148.28;

    location /api {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

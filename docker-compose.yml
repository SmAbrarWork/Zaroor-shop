services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: dev
    env_file:
      - ./client/.env
    ports:
      - '3000:3000'
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: dev
    env_file:
      - ./server/.env
    ports:
      - '5000:5000'
    volumes:
      - ./server/src:/app/src
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:

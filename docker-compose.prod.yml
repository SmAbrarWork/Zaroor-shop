services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
    env_file:
      - ./client/.env
    ports:
      - '3000:3000'
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    env_file:
      - ./server/.env
    ports:
      - '5000:5000'
